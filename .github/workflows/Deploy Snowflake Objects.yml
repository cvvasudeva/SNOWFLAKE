name: Deploy Snowflake Objects

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-cli-action@v1

      - name: Execute SQL
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWSQL_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWSQL_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

        run: |
          snow sql \
            -a RQVFAHA-BQ57083 \
            -u VASUDEVASFD1 \
            -password "Vasudeva.sfd@2" \
            --query "
            USE ROLE ACCOUNTADMIN;
            USE WAREHOUSE COMPUTE_WH;
            USE DATABASE MY_DB;
            USE SCHEMA MY_SCHEMA;
            "

          snow sql \
            --account $SNOWFLAKE_ACCOUNT \
            --user $SNOWFLAKE_USER \
            --password "$SNOWFLAKE_PASSWORD" \
            --filename sql/create_emp_practice_table.sql
